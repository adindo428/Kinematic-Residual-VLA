# Faithful Cartesian KRFM fine-tuning config for DOM.
# Uses hzxie/dynamic-vla-DOM as the Cartesian-action baseline and estimates
# global train-split d_bar for residual action centering.
CONST:
  EXP_NAME: residual_dynamicvla_dom_cartesian_512
  N_WORKERS: 8

DATASET:
  NAME: hzxie/DOM
  PIN_MEMORY: false
  USE_DELTA_ACTION: true
  IMG_SIZE:
  TRAIN_EPISODE_RANGE: [1, 512]
  TEST_EPISODES: [0, 1000, 2000, 3000]
  DELTA_TIMESTAMPS:
    observation: [-2, 0]
  REQUIRED_FEATURES:
    - observation.images.opst_cam
    - observation.images.wrist_cam
    - observation.state
    - observation.environment_state
    - action

POLICY:
  TYPE: dynamicvla
  CHECKPOINT: hzxie/dynamic-vla-DOM
  N_OBS_STEPS: 2
  CHUNK_SIZE: 50
  N_ACTION_STEPS: 20
  RESIZE_IMGS_WITH_PADDING: [384, 384]
  ATTENTION_MODE: cross_attn
  VLM_MODEL_NAME: HuggingFaceTB/SmolLM2-360M
  NUM_VLM_LAYERS: 16
  NUM_EXPERT_SKIP_LAYERS: 0
  TEMPORAL_FUSION: attn
  FREEZE_VISION_MODEL: true
  FREEZE_CONNECTOR: true
  FREEZE_TEXT_MODEL: true
  ENABLE_RESIDUAL_FLOW: true
  # Options: constant, linear, cosine. Mirrors residual_flow_matching/residual_flow_2d.py.
  RESIDUAL_LAMBDA_TYPE: constant
  RESIDUAL_DRIFT_SCALE: 1.0
  RESIDUAL_DRIFT_MODE: trajectory
  RESIDUAL_ACTION_DT: 0.04
  RESIDUAL_AXIS_SCALE_XYZ: [1.0, 1.0, 1.0]
  RESIDUAL_POSITION_KEY: dynamic_object.position_xyz
  RESIDUAL_VELOCITY_KEY: dynamic_object.velocity_xyz
  RESIDUAL_COVARIANCE_KEY: dynamic_object.covariance_xyz
  RESIDUAL_LOOKAHEAD_POSITION_KEY: dynamic_object.lookahead_position_xyz
  RESIDUAL_LOOKAHEAD_HORIZON_KEY: dynamic_object.lookahead_horizon_s
  RESIDUAL_LOOKAHEAD_HORIZON_S: 1.0
  RESIDUAL_NORMALIZE_DRIFT: true
  RESIDUAL_CENTER_DRIFT: true
  RESIDUAL_ESTIMATE_DRIFT_MEAN: true
  RESIDUAL_DRIFT_MEAN_MAX_BATCHES: 0
  RESIDUAL_DRIFT_MEAN_CACHE: true
  RESIDUAL_DRIFT_MEAN_CACHE_DIR:
  USE_CHECKPOINT_NORMALIZATION: true

DIR:
  OUTPUT: ./runs

WANDB:
  ENABLED: false
  PROJECT: DynamicVLA
  ENTITY: haozhexie
  MODE: online
  RUN_ID: null
  LOG_CODE: true
  SYNC_TENSORBOARD: false

TRAIN:
  N_EPOCHS: 50
  BATCH_SIZE: 16
  GRAD_ACCUM_STEPS: 1
  CKPT_SAVE_FREQ:
    EPOCH: 5
    BATCH: 0
  OPTIMIZER:
    LR: 5.0e-5
    EPS: 1.0e-8
    WEIGHT_DECAY: 1.0e-10
    BETAS: [0.9, 0.95]
  LR_SCHEDULER:
    NAME: cosine
    N_WARMUP_STEPS: 500
  IMAGE_TRANSFORMS:
    BRIGHTNESS: [0.8, 1.2]
    CONTRAST: [0.8, 1.2]
    SATURATION: [0.5, 1.5]
    HUE: [-0.05, 0.05]
