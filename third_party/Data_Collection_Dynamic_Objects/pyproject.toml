[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dom-tracking-collector"
version = "0.1.0"
description = "Franka hover tracking collection and DOM v2.1 export"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "PyYAML>=6,<7", "pyarrow>=14", "av>=12", "huggingface-hub>=0.30,<2", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dom-track = "dom_tracking.cli:main"

[tool.setuptools.packages.find]
include = ["dom_tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
