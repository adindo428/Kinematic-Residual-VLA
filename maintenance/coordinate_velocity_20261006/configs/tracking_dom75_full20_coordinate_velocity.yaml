    - 0.8
    - 1.2
    CONTRAST:
    - 0.8
    - 1.2
    SATURATION:
    - 0.5
    - 1.5
    HUE:
    - -0.05
    - 0.05
  EVAL_OBJECT_PROXIMITY: false
  EVAL_NOISE_SEED: 42
